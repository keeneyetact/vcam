[package]
name = "vcam_native"
version = "0.1.0"
edition = "2021"
description = "Rust per-frame kernels for vcam (pre/post-processing around RVM, compositing)"
publish = false

[lib]
name = "vcam_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
numpy = "0.23"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
