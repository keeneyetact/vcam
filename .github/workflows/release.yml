# Builds the Windows exe and publishes it as a GitHub Release.
# Push a tag like v0.2.0 to release that version; or run it by hand from the
# Actions tab to get the build as a downloadable artifact without a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Bundled into the exe by build.rs, so the release needs no download.
      - name: Fetch models
        shell: bash
        run: |
          mkdir -p models
          curl -fL -o models/rvm_mobilenetv3_fp32.onnx \
            https://github.com/PeterL1n/RobustVideoMatting/releases/download/v1.0.0/rvm_mobilenetv3_fp32.onnx
          curl -fL -o models/face_detection_yunet_2023mar.onnx \
            https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { "vcam-$env:GITHUB_REF_NAME-windows-x64" } else { "vcam-windows-x64" }
          New-Item -ItemType Directory -Force dist/$name | Out-Null
          Copy-Item target/release/vcam.exe, target/release/vcam-cli.exe, README.md dist/$name/
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name.zip
          Copy-Item target/release/vcam.exe dist/vcam.exe
          "NAME=$name" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vcam.exe
            dist/${{ env.NAME }}.zip
          generate_release_notes: true
